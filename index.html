<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Royal Dine | Luxury Restaurant</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
:root{
--green:#0f3d2e;
--gold:#d4af37;
--light:#ffffff;
--dark:#121212;
}

body{
margin:0;
font-family:'Poppins',sans-serif;
background:var(--light);
transition:0.3s;
}

.dark{background:var(--dark);color:white;}

header{
background:var(--green);
color:white;
padding:15px 30px;
display:flex;
justify-content:space-between;
align-items:center;
position:sticky;
top:0;
}

.logo{color:var(--gold);font-size:22px;font-weight:600;}

nav{display:flex;gap:20px;}
nav a{color:white;text-decoration:none;}

.menu-toggle{display:none;font-size:24px;cursor:pointer;}

.hero{
text-align:center;
padding:80px 20px;
background:linear-gradient(rgba(0,0,0,0.6),rgba(0,0,0,0.6)),
url('https://images.unsplash.com/photo-1541542684-4a8c8b2a8f42');
background-size:cover;
color:white;
}

.section{padding:50px 8%;}

.menu-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:25px;
}

.card{
background:white;
border-radius:15px;
overflow:hidden;
box-shadow:0 8px 20px rgba(0,0,0,0.1);
}

.dark .card{background:#1e1e1e;}

.card img{
width:100%;
height:200px;
object-fit:cover;
}

.card-content{padding:15px;}

.price{color:var(--gold);font-weight:600;}

button{
padding:8px 15px;
border:none;
background:var(--green);
color:white;
border-radius:20px;
cursor:pointer;
margin-top:8px;
}

button:hover{background:var(--gold);color:black;}

.cart{
position:fixed;
right:0;
top:0;
width:320px;
height:100%;
background:white;
box-shadow:-5px 0 15px rgba(0,0,0,0.2);
padding:20px;
overflow:auto;
display:none;
}

.dark .cart{background:#1e1e1e;color:white;}

@media(max-width:768px){
nav{
display:none;
flex-direction:column;
background:var(--green);
position:absolute;
right:0;
top:60px;
padding:20px;
}
nav.active{display:flex;}
.menu-toggle{display:block;}
}
</style>
</head>

<body>

<header>
<div class="logo">Royal Dine</div>
<div class="menu-toggle" onclick="toggleMenu()">☰</div>
<nav id="navLinks">
<a href="#">Home</a>
<a href="#">Menu</a>
<a href="#" onclick="openCart()">Cart 🛒</a>
<a href="#" onclick="toggleDark()">🌙</a>
</nav>
</header>

<section class="hero">
<h1>Luxury 5-Star Dining Experience</h1>
<p>Premium • Elegant • Delicious</p>
</section>

<section class="section">
<h2>Our Special Menu</h2>
<div class="menu-grid" id="menuGrid"></div>
</section>

<div class="cart" id="cart">
<h2>Your Cart</h2>
<ul id="cartItems"></ul>
<h3>Total: ₹<span id="total">0</span></h3>
<button onclick="goPayment()">Proceed to Pay 💳</button>
<button onclick="closeCart()">Close</button>
</div>

<script>
const items=[
["Truffle Pasta",499,"https://www.yellowthyme.com/wp-content/uploads/2024/07/Truffle-mushroom-pasta-2.jpg"],
["Royal Biryani",599,"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQoIycguxFgTpIN3L00tYQhJ2WkypXj5w_QkQ&s"],
["Signature Burger",399,"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQzUbGeWwknUmpqTTIbl1mOAai56ktBIE5y3Q&s"],
["Grilled Salmon",899,"https://www.thecookierookie.com/wp-content/uploads/2023/05/featured-grilled-salmon-recipe.jpg"],
["Lobster Thermidor",1299,"https://lobsteranywhere.com/wp-content/uploads/2016/09/How-to-make-Lobster-Thermidor.jpg"],
["BBQ Chicken Steak",699,"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ9ESeQqtDlkrgQxCZDaLDXrNwyF-74PvJrVg&s"],
["Caesar Salad",349,"https://playswellwithbutter.com/wp-content/uploads/2024/06/Charred-Sweet-Corn-Caesar-Salad-12.jpg"],
["Margherita Pizza",459,"https://www.rakijagrill.com/wp-content/uploads/2020/07/Margherita-.jpg"],
["Thai Green Curry",549,"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSZjhB18Y1oSwEfLhhXqEASmUWlEWrPH416sw&s"],
["Stuffed Mushroom",399,"https://spicecravings.com/wp-content/uploads/2022/12/Stuffed-Mushrooms-Featured.jpg"],
["Sushi Platter",999,"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTRGz3XY1W_B3AZ1x8izaBoazJDn3HdQGMc8A&s"],
["Chocolate Waffles",299,"https://cdn.shopify.com/s/files/1/0173/8181/8422/files/20240523183203-screenshot-202024-05-10-20at-204.png?v=1716489126&width=1000&height=1000"],
["Strawberry Milkshake",249,"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTE-1kaxr9oPJyf4y89AHSdj137z1ELgk0rpQ&s"],
["Caramel Macchiato",299,"https://dinnerthendessert.com/wp-content/uploads/2023/10/Caramel-Macchiato-10.jpg"],
["Hazelnut Latte",279,"https://images.ctfassets.net/v601h1fyjgba/3bxPeyxH6YlWxBUlPuCgPE/9ac292d4d71ac65d6ec53ee51f3534ab/Mocha_Hazelnut_Latte.jpg"]
];

let cart=JSON.parse(localStorage.getItem("cart"))||[];

const menuGrid=document.getElementById("menuGrid");

items.forEach(item=>{
menuGrid.innerHTML+=`
<div class="card">
<img src="${item[2]}" alt="${item[0]}">
<div class="card-content">
<h3>${item[0]}</h3>
<p class="price">₹${item[1]}</p>
<button onclick="addToCart('${item[0]}',${item[1]})">Add to Cart</button>
</div>
</div>
`;
});

function toggleMenu(){
document.getElementById("navLinks").classList.toggle("active");
}

function toggleDark(){
document.body.classList.toggle("dark");
}

function openCart(){
document.getElementById("cart").style.display="block";
renderCart();
}

function closeCart(){
document.getElementById("cart").style.display="none";
}

function addToCart(name,price){
let existing=cart.find(i=>i.name===name);
if(existing) existing.qty++;
else cart.push({name,price,qty:1});
localStorage.setItem("cart",JSON.stringify(cart));
alert("Added to cart");
}

function renderCart(){
let list=document.getElementById("cartItems");
let total=0;
list.innerHTML="";
cart.forEach((item,index)=>{
total+=item.price*item.qty;
list.innerHTML+=`
<li>${item.name} (x${item.qty}) - ₹${item.price*item.qty}
<button onclick="removeItem(${index})">❌</button></li>
`;
});
document.getElementById("total").innerText=total;
}

function removeItem(index){
cart.splice(index,1);
localStorage.setItem("cart",JSON.stringify(cart));
renderCart();
}

function goPayment(){
window.location.href="payment.html";
}
</script>

</body>
</html>
